name: Build and Deploy Next.js Stealth

on:
  push:
    branches: [ "develop" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/stealth-client:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Injecting the Build Args required by your Stage 2 (Builders)
          build-args: |
            NEXT_PUBLIC_CLINICAL_TABLES=${{ secrets.NEXT_PUBLIC_CLINICAL_TABLES }}
            NEXT_PUBLIC_FIREBASE_S3_STORAGE=${{ secrets.NEXT_PUBLIC_FIREBASE_S3_STORAGE }}
            NEXT_PUBLIC_IMS_API_URL=${{ secrets.NEXT_PUBLIC_IMS_API_URL }}
            NEXT_PUBLIC_IMS_API_URL_BASE=${{ secrets.NEXT_PUBLIC_IMS_API_URL_BASE }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_PORT }}
          script: |
            # 1. Pull the new image
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/stealth-client:${{ needs.build-and-push.outputs.short_sha }}

            cd ~/stealth_ims
            CLIENT_IMAGE_TAG=${{ needs.build-and-push.outputs.short_sha }} docker compose up -d client
            docker image prune -f
